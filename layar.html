<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layar Antrian Utama - Rumah Sakit</title>
<link rel="stylesheet" href="css/style.css">

<script type="module" src="dist/layar.js?v=4" defer></script>
</head>

<body>
<nav class="navbar layar-nav">
<div class="navbar-brand" style="font-size: 1.8rem;">Monitor Antrian Ruang Tunggu</div>
<div class="layar-controls">
<span id="lastUpdated" class="layar-updated">Diperbarui: -</span>
<button id="btnFullscreen" class="btn btn-primary" type="button">Layar Penuh</button>
<button id="btnExit" class="btn btn-danger" type="button">Keluar</button>
</div>
</nav>

<main class="container layar-container">
<section id="layarHero" class="layar-hero">
<p class="layar-hero-label">Sedang Dipanggil</p>
<p id="heroNumber" class="layar-hero-number">---</p>
<p id="heroService" class="layar-hero-service">Menunggu panggilan</p>
</section>

<div id="layarGrid" class="layar-grid"></div>
</main>
</body>

</html>
