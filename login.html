<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Antrian</title>
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="dist/login.js" defer></script>
</head>

<body class="page-center">
    <main class="card login-card">
        <div class="navbar-brand">Sistem Antrian RS</div>
        <h1 class="mt-3">Masuk Petugas</h1>
        <p class="text-muted">Login sebagai admin atau operator</p>

        <form id="loginForm" class="form" novalidate>
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control" autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" autocomplete="current-password">

            <div id="loginError" class="alert alert-danger" hidden></div>

            <button type="submit" id="btnLogin" class="btn btn-primary w-100">
                <span id="loginSpinner" class="spinner" hidden></span>
                <span id="loginText">Masuk</span>
            </button>
        </form>

        <div id="demoBox" class="demo-box" hidden>
            <p class="text-muted">Akun demo (klik untuk mengisi otomatis):</p>
            <div id="demoList" class="demo-list"></div>
        </div>

        <div class="public-links">
            <a href="ambil-antrian.html">Ambil Antrian</a>
            <a href="layar.html">Layar Antrian</a>
        </div>
    </main>
</body>

</html>
